[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hypr-vocal-command"
version = "0.1.0"
description = "Local voice-triggered command execution daemon for Hyprland (English + Egyptian Arabic)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "typer>=0.12",
    "cachetools>=5.3",
]

[project.scripts]
hypr-vocal-command = "hypr_vocal_command.cli:app"
hypr-vocal-command-trigger = "hypr_vocal_command.client:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.10",
]
audio = [
    "pywhispercpp>=1.5.0",
    "sounddevice>=0.4.6",
    "onnxruntime>=1.18",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.12"
strict = false

[[tool.mypy.overrides]]
module = ["sounddevice", "onnxruntime", "onnxruntime.*", "pywhispercpp.*"]
ignore_missing_imports = true
