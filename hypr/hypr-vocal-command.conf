# hypr-vocal-command keybinds.
#
# SUPER+V and SUPER+B are already bound on this system (togglefloating / bluetooth
# menu), so this project deliberately uses SUPER+ALT+V / SUPER+ALT+B instead.
#
# client.py (installed as `hypr-vocal-command-trigger`) is a stdlib-only, near-instant
# fire-and-forget trigger -- it just wakes the already-running daemon and exits; all
# actual feedback (heard/executed) comes from the daemon's own desktop notifications,
# not from this exec'd process.
#
# Install: copy or symlink this file to ~/.config/hypr/hypr-vocal-command.conf, then add
# exactly one line to your hand-maintained hyprland.conf (matching its existing modular
# `source = ~/.config/hypr/<file>.conf` convention):
#
#   source = ~/.config/hypr/hypr-vocal-command.conf

bind = SUPER ALT, V, exec, /home/hashim/Documents/Coding/hypr-vocal-command/.venv/bin/hypr-vocal-command-trigger --lang en

# Egyptian Arabic pipeline isn't wired up yet (Phase 9) -- the daemon currently rejects
# any language other than "en" with a clear notification, rather than silently no-oping.
bind = SUPER ALT, B, exec, /home/hashim/Documents/Coding/hypr-vocal-command/.venv/bin/hypr-vocal-command-trigger --lang ar
